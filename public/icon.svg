<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="105" fill="#000000"/>
  <defs>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b81d24"/>
      <stop offset="100%" stop-color="#831010"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#831010"/>
      <stop offset="100%" stop-color="#b81d24"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-8" dy="0" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Left Column -->
  <path d="M 50 45 L 160 45 L 160 467 L 50 467 Z" fill="url(#leftGrad)"/>
  <!-- Right Column -->
  <path d="M 352 45 L 462 45 L 462 467 L 352 467 Z" fill="url(#rightGrad)"/>
